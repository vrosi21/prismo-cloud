# Dependabot opens a pull request when something Prismo depends on has a new version, and
# straight away when one has a published vulnerability. Nothing is merged or deployed by
# itself: a change reaches the server only through deploy/deploy.sh.
version: 2
updates:
  # The API and worker (Go modules). Minor and patch releases come as one weekly PR.
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  # The web app (pnpm). Same grouping.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]

  # The Go and Alpine images the API is built from.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly

  # Postgres and Garage as they run on the server (deploy/compose.yaml).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
